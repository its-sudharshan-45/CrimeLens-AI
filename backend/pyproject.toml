[project]
name = "crimelens-ai-backend"
version = "0.1.0"
description = "CrimeLens AI Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn>=0.27.1",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "pydantic-settings>=2.2.1",
    "loguru>=0.7.2",
    "supabase>=2.3.4",
    "asyncpg>=0.29.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "torch>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.4.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
